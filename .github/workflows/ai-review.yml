name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    uses: joaomj/github-ci/.github/workflows/ai-review.yml@5ec31218bf48cc7e6066cecb0ffb81c3e68499e3
    with:
      ci-ref: "5ec31218bf48cc7e6066cecb0ffb81c3e68499e3"
      config-ref: "5b09c4ab50cca7448c46eb28e4a42203edb67c86"
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
