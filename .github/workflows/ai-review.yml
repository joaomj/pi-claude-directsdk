name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    uses: joaomj/github-ci/.github/workflows/ai-review.yml@v1.0.0
    with:
      ci-ref: "v1.0.0"
      config-ref: "v0.7.2"
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
