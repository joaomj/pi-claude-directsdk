name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    uses: joaomj/pi-agent-config/.github/workflows/ai-review.yml@188c649df1bbb1ec75a49ce9e8fe9f2c268c7334
    with:
      config-ref: "188c649df1bbb1ec75a49ce9e8fe9f2c268c7334"
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
