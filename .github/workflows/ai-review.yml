name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    uses: joaomj/github-ci/.github/workflows/ai-review.yml@71a29ed056f82629fe7278762b5e626d18e8b76d
    with:
      ci-ref: "@71a29ed056f82629fe7278762b5e626d18e8b76d"
      config-ref: "5b09c4ab50cca7448c46eb28e4a42203edb67c86"
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
